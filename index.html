<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Souls Builds — community-sourced tier lists for Bloodborne, Elden Ring, and Demon's Souls, with maps, crafting notes, equipment, stat spreads, and source links.">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Souls Builds">
  <title>Souls Builds</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./atmosphere.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="fog" aria-hidden="true"></div>
  <canvas id="embers" aria-hidden="true"></canvas>

  <header>
    <div class="wrap head">
      <div class="brand-row">
        <div class="brand">
          <img class="mark" src="./icons/emblem.png" width="49" height="58" alt="">
          <h1>Souls Builds</h1>
        </div>
        <nav class="tabs" aria-label="Sections">
          <button type="button" id="tab-tiers" role="tab" aria-selected="true" aria-controls="panel-tiers">Tiers</button>
          <button type="button" id="tab-guides" role="tab" aria-selected="false" aria-controls="panel-guides">Guides</button>
          <button type="button" id="tab-about" aria-haspopup="dialog">About</button>
        </nav>
      </div>
      <div class="switch-row">
        <div class="game-row" id="game-row" role="group" aria-label="Games"></div>
        <p class="catalog" id="catalog"></p>
      </div>
      <nav id="section-nav" class="section-nav" aria-label="Game sections"></nav>
      <p class="lede" id="lede">Tiers are an editorial synthesis of community opinion.</p>
    </div>
  </header>

  <main class="wrap" id="content">
    <section id="panel-tiers" role="tabpanel" aria-labelledby="tab-tiers">
      <div class="controls">
        <div class="search">
          <label class="visually-hidden" for="q">Search builds</label>
          <input id="q" type="search" placeholder="Search builds, weapons, playstyles" autocomplete="off" enterkeyhint="search" spellcheck="false">
        </div>
        <div class="filters">
          <div class="filter-group">
            <span class="filter-label" id="arch-label">Archetype</span>
            <div class="chip-row" id="arch-row" role="group" aria-labelledby="arch-label"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label" id="best-label">Best for</span>
            <div class="chip-row" id="best-row" role="group" aria-labelledby="best-label"></div>
          </div>
        </div>
        <div class="toolbar">
          <p id="count" aria-live="polite"></p>
          <div class="toolbar-actions">
            <button type="button" id="density" class="density" aria-pressed="false">Playstyles</button>
            <label class="sort">Sort
            <select id="sort">
              <option value="listed">Listed order</option>
              <option value="name">Name</option>
              <option value="weapon">Main weapon</option>
            </select>
          </label>
          </div>
        </div>
      </div>
      <div id="tier-list" class="is-compact"></div>
    </section>

    <section id="panel-guides" role="tabpanel" aria-labelledby="tab-guides" hidden>
      <div class="controls">
        <div class="filter-group">
          <span class="filter-label" id="guide-label">Site</span>
          <div class="chip-row" id="guide-row" role="group" aria-labelledby="guide-label"></div>
        </div>
        <p id="guide-count" aria-live="polite"></p>
      </div>
      <div id="guide-list" class="guide-list"></div>
    </section>

    <section id="panel-map" hidden></section>
    <section id="panel-crafting" hidden></section>
    <section id="panel-equipment" hidden></section>

    <footer class="colophon" id="colophon"></footer>
  </main>

  <div id="map-embed" class="map-embed" hidden>
    <div class="map-embed-bar">
      <a id="map-embed-fallback" href="https://mapgenie.io/elden-ring/maps/the-lands-between" target="_blank" rel="noopener noreferrer">Open in a new tab</a>
      <button type="button" id="map-embed-close">Close</button>
    </div>
    <p class="map-embed-hint">If the frame stays blank, the site blocked embedding. Use the link above.</p>
    <iframe id="map-embed-frame" title="Interactive map" referrerpolicy="no-referrer"></iframe>
  </div>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-bar">
        <button type="button" class="sheet-close">Close</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <noscript>
    <p class="lede wrap">JavaScript is required to read the build lists. Game data lives under data/.</p>
  </noscript>
  <script src="./sections.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
