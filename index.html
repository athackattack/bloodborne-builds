<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A community-sourced tier list of Bloodborne character builds, with stat spreads and source links.">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BB Builds">
  <title>Bloodborne Builds</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="fog" aria-hidden="true"></div>

  <header>
    <div class="wrap head">
      <div class="brand-row">
        <div class="brand">
          <img class="mark" src="./icon.svg" width="44" height="44" alt="">
          <h1>Bloodborne Builds</h1>
        </div>
        <nav class="tabs" aria-label="Sections">
          <button type="button" id="tab-tiers" role="tab" aria-selected="true" aria-controls="panel-tiers">Tiers</button>
          <button type="button" id="tab-guides" role="tab" aria-selected="false" aria-controls="panel-guides">Guides</button>
          <button type="button" id="tab-about" aria-haspopup="dialog">About</button>
        </nav>
      </div>
      <p class="lede" id="lede">Tiers are an editorial synthesis of community opinion, weighted toward PvE.</p>
    </div>
  </header>

  <main class="wrap" id="content">
    <section id="panel-tiers" role="tabpanel" aria-labelledby="tab-tiers">
      <div class="controls">
        <div class="search">
          <label class="visually-hidden" for="q">Search builds</label>
          <input id="q" type="search" placeholder="Search builds, weapons, playstyles" autocomplete="off" enterkeyhint="search" spellcheck="false">
        </div>
        <div class="filters">
          <div class="filter-group">
            <span class="filter-label" id="arch-label">Archetype</span>
            <div class="chip-row" role="group" aria-labelledby="arch-label">
              <button type="button" class="chip" data-arch="" aria-pressed="true">All</button>
              <button type="button" class="chip" data-arch="Strength" aria-pressed="false">Strength</button>
              <button type="button" class="chip" data-arch="Skill" aria-pressed="false">Skill</button>
              <button type="button" class="chip" data-arch="Bloodtinge" aria-pressed="false">Bloodtinge</button>
              <button type="button" class="chip" data-arch="Arcane" aria-pressed="false">Arcane</button>
              <button type="button" class="chip" data-arch="Quality" aria-pressed="false">Quality</button>
              <button type="button" class="chip" data-arch="Hybrid" aria-pressed="false">Hybrid</button>
            </div>
          </div>
          <div class="filter-group">
            <span class="filter-label" id="best-label">Best for</span>
            <div class="chip-row" role="group" aria-labelledby="best-label">
              <button type="button" class="chip" data-best="" aria-pressed="true">All</button>
              <button type="button" class="chip" data-best="PvE" aria-pressed="false">PvE</button>
              <button type="button" class="chip" data-best="PvP" aria-pressed="false">PvP</button>
              <button type="button" class="chip" data-best="beginner" aria-pressed="false">Beginner</button>
              <button type="button" class="chip" data-best="chalice" aria-pressed="false">Chalice</button>
              <button type="button" class="chip" data-best="NG+" aria-pressed="false">NG+</button>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <p id="count" aria-live="polite"></p>
          <label class="sort">Sort
            <select id="sort">
              <option value="listed">Listed order</option>
              <option value="name">Name</option>
              <option value="weapon">Main weapon</option>
            </select>
          </label>
        </div>
      </div>
      <div id="tier-list"></div>
    </section>

    <section id="panel-guides" role="tabpanel" aria-labelledby="tab-guides" hidden>
      <div class="controls">
        <div class="filter-group">
          <span class="filter-label" id="guide-label">Site</span>
          <div class="chip-row" role="group" aria-labelledby="guide-label">
            <button type="button" class="chip" data-guide="" aria-pressed="true">All</button>
            <button type="button" class="chip" data-guide="wiki" aria-pressed="false">Wiki</button>
            <button type="button" class="chip" data-guide="guide" aria-pressed="false">Guide</button>
            <button type="button" class="chip" data-guide="video" aria-pressed="false">Video</button>
          </div>
        </div>
        <p id="guide-count" aria-live="polite"></p>
      </div>
      <div id="guide-list" class="guide-list"></div>
    </section>

    <footer class="colophon" id="colophon"></footer>
  </main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-bar">
        <button type="button" class="sheet-close">Close</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <noscript>
    <p class="lede wrap">JavaScript is required to read the build list. The research data is in data/builds.json.</p>
  </noscript>
  <script src="./app.js" defer></script>
</body>
</html>
